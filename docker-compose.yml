services:
  control-plane:
    build:
      context: .
      dockerfile: control_plane/Dockerfile
    env_file:
      - path: control_plane/.env
        required: false
    depends_on: [postgres, redis, minio, guacd]
    ports: ["8876:8876"]
    volumes: ["asaas-data:/app/data"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asaas
      POSTGRES_USER: asaas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asaas_local_dev_password}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asaas-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-asaas_local_minio_password}
    volumes: ["minio-data:/data"]
  guacd:
    image: guacamole/guacd:1.5.5

volumes:
  asaas-data:
  postgres-data:
  redis-data:
  minio-data:
