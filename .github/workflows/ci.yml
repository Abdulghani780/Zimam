name: ASAAS Server Control CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Build Frontend & Validate Architecture
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck and Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil>=7.0.0

      - name: Verify Backend Smoke Test & SQLite Schema
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'backend')
          from app.core.config import DB_PATH, PROJECT_ROOT
          from app.infrastructure.db import init_db, get_db_connection
          init_db()
          assert os.path.exists(DB_PATH), 'Database was not created'
          conn = get_db_connection()
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM app_users')
          users_cnt = cur.fetchone()[0]
          print(f'Database initialized successfully with {users_cnt} default users.')
          assert users_cnt >= 3, 'Default RBAC users missing'
          "

      - name: Prepare Ephemeral Test Admin & Start Backend
        run: |
          python -c "
          import sys; sys.path.insert(0, 'backend')
          from app.infrastructure.db import init_db, get_db_connection, hash_password
          from datetime import datetime, timezone
          init_db()
          h, s = hash_password('admin@asaas2026')
          conn = get_db_connection(); cur = conn.cursor()
          cur.execute('SELECT id FROM app_users WHERE username = ?', ('admin',))
          if not cur.fetchone():
              cur.execute('''INSERT INTO app_users (username, password_hash, salt, role, full_name, is_active, created_at)
                             VALUES (?, ?, ?, 'admin', 'CI Admin', 1, ?)''', ('admin', h, s, datetime.now(timezone.utc).isoformat()))
              conn.commit()
          print('test admin ready')
          "
          Start-Process -FilePath python -ArgumentList 'backend/main.py' -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Run Backend Unit & Contract Tests
        run: python -m unittest discover -s tests -v

      - name: Install Control Plane Dependencies
        run: pip install -r control_plane/requirements.txt

      - name: Run Control Plane Security Tests
        env:
          PYTHONPATH: control_plane
        run: python -m unittest discover -s control_plane/tests -v

  e2e-smoke:
    name: Playwright Smoke (login + core journeys)
    runs-on: windows-latest
    needs: validate-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install chromium

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependency
        run: pip install psutil>=7.0.0

      - name: Bootstrap E2E Administrator
        working-directory: backend
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from app.infrastructure.db import init_db, db_bootstrap_admin; init_db(); print(db_bootstrap_admin('e2e-admin', 'E2e!Smoke#Passw0rd2026!', 'E2E Admin'))"

      - name: Start ASAAS Backend
        run: |
          Start-Process -FilePath python -ArgumentList 'backend/main.py' -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Run Playwright Smoke Tests
        working-directory: frontend
        env:
          E2E_USER: e2e-admin
          E2E_PASS: E2E!Smoke#Passw0rd2026!
        run: npx playwright test e2e/smoke.spec.ts --project="Desktop Chromium"
